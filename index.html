<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OQEAN - Subsea HVDC Cable Routing Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    p.subtitle {
      color: var(--text-muted);
      margin: 0;
    }

    #results-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    h3 {
      margin-top: 0;
      font-size: 1.25rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      margin-top: 1rem;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    code {
      background-color: #0f172a;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-family: "Courier New", Courier, monospace;
      color: var(--accent);
    }

    .badge {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--success);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>OQEAN HVDC Grid</h1>
      <p class="subtitle">Quantum QAOA Subsea Cable Routing Optimization Dashboard</p>
    </header>

    <!-- Inside index.html -->
    <div id="results-container">
      <h3>Latest QAOA Optimization Results</h3>
      <table id="results-table">
        <thead>
          <tr>
            <th>Candidate Bitstring</th>
            <th>Cost (Energy Loss)</th>
            <th>Probability</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="4">Loading quantum results...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadQuantumResults() {
      try {
        // Fetch the exported results file
        const response = await fetch('./docs/data/results.json');
        const data = await response.json();

        const tbody = document.getElementById('table-body');
        tbody.innerHTML = ''; // Clear loading row

        data.top_routes.forEach(route => {
          const row = `
            <tr>
              <td><code>${route.bitstring}</code></td>
              <td>${route.cost.toFixed(4)}</td>
              <td>${(route.probability * 100).toFixed(1)}%</td>
              <td><span class="badge">${route.status}</span></td>
            </tr>
          `;
          tbody.innerHTML += row;
        });
      } catch (error) {
        console.error('Error loading optimization data:', error);
        document.getElementById('table-body').innerHTML = 
          '<tr><td colspan="4">Run the Python evaluator script to generate live results.</td></tr>';
      }
    }

    // Load when page opens
    window.addEventListener('DOMContentLoaded', loadQuantumResults);
  </script>

</body>
</html>
